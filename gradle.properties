# Memory for the Gradle build process
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Use AndroidX libraries (the modern replacement for the old support libraries)
android.useAndroidX=true
# Official Kotlin code style
kotlin.code.style=official
# Generate smaller R classes (only resources of this module)
android.nonTransitiveRClass=true
